<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Shift Happens Motors</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .checkout-page {
            width: 90%;
            max-width: 1200px;
            margin: 60px auto;
        }

        .checkout-title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 35px;
        }

        .checkout-container {
            max-width: 800px;
            margin: 0 auto;
        }

        #checkout-form {
            width: 100%;
        }

    </style>
</head>


<body>

    <main class="checkout-page">

        <h1 class="checkout-title">
            CHECKOUT
        </h1>

        <div class="checkout-container">

            <!-- Stripe Embedded Checkout appears here -->
            <div id="checkout-form"></div>

        </div>

    </main>


    <script src="https://js.stripe.com/clover/stripe.js"></script>

    <script src="js/checkout.js"></script>

</body>

</html>
