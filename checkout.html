<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Shift Happens Motors</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top, rgba(0, 136, 255, 0.12), transparent 35%),
            linear-gradient(180deg, #0a1020 0%, #07101c 100%);
        font-family: Arial, sans-serif;
        color: #ffffff;
    }

    .checkout-page {
        width: 90%;
        max-width: 1000px;
        margin: 70px auto;
    }

    .checkout-title {
        text-align: center;
        font-size: 48px;
        margin-bottom: 40px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow:
            0 0 8px #ffffff,
            0 0 18px #35c8ff;
    }

    .checkout-box {
        background: rgba(7, 16, 28, 0.92);
        padding: 34px;
        border: 1px solid #35c8ff;
        box-shadow:
            0 0 10px rgba(53, 200, 255, 0.45),
            inset 0 0 25px rgba(53, 200, 255, 0.05);
        border-radius: 4px;
    }

    .checkout-box h2 {
        margin-top: 0;
        margin-bottom: 22px;
        text-transform: uppercase;
        font-size: 22px;
        letter-spacing: 1.5px;
        color: #ffffff;
    }

    .address-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .address-grid input {
        padding: 13px 14px;
        font-size: 15px;

        color: #ffffff;
        background: #0d1726;

        border: 1px solid #289ed1;
        border-radius: 2px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .address-grid input::placeholder {
        color: #8da5b5;
    }

    .address-grid input:focus {
        border-color: #54d8ff;
        box-shadow: 0 0 10px rgba(84, 216, 255, 0.45);
    }

    .full-width {
        grid-column: 1 / -1;
    }

    #calculate-shipping,
    #continue-payment,
    #shipping-rates button {
        background: #0c1b2b;
        color: #ffffff;

        border: 1px solid #35c8ff;

        padding: 13px 20px;

        font-size: 14px;
        font-weight: bold;

        letter-spacing: 1px;
        text-transform: uppercase;

        cursor: pointer;

        box-shadow: 0 0 8px rgba(53, 200, 255, 0.25);

        transition:
            background 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.1s ease;
    }

    #calculate-shipping {
        margin-top: 20px;
    }

    #calculate-shipping:hover,
    #continue-payment:hover,
    #shipping-rates button:hover {
        background: #12304a;
        box-shadow: 0 0 14px rgba(53, 200, 255, 0.6);
    }

    #calculate-shipping:active,
    #continue-payment:active,
    #shipping-rates button:active {
        transform: translateY(1px);
    }

    #shipping-rates {
        margin-top: 28px;
    }

    #shipping-rates h3 {
        margin-bottom: 14px;

        font-size: 17px;
        text-transform: uppercase;
        letter-spacing: 1px;

        color: #35c8ff;
    }

    #shipping-rates button {
        display: block;
        width: 100%;
        margin: 9px 0;
        text-align: left;
    }

    #continue-payment {
        display: none;
        width: 100%;
        margin-top: 24px;
        padding: 15px 22px;

        background: #e9faff;
        color: #07101c;

        border-color: #ffffff;

        box-shadow:
            0 0 10px rgba(255,255,255,0.5),
            0 0 18px rgba(53,200,255,0.45);
    }

    #continue-payment:hover {
        background: #ffffff;
        box-shadow:
            0 0 14px rgba(255,255,255,0.8),
            0 0 24px rgba(53,200,255,0.65);
    }

    #continue-payment:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    .checkout-note {
        margin-top: 17px;
        font-size: 12px;
        letter-spacing: 0.6px;
        color: #7f9bad;
        text-transform: uppercase;
    }

    @media(max-width: 650px) {
        .checkout-page {
            width: 92%;
            margin: 35px auto;
        }

        .checkout-title {
            font-size: 34px;
        }

        .checkout-box {
            padding: 22px;
        }

        .address-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }
    }
    .checkout-corner-logo {
    position: fixed;
    top: 30px;
    width: 250px;
    height: auto;
    z-index: 10;

    filter: drop-shadow(0 0 10px rgba(53, 200, 255, 0.7));
}

.checkout-logo-left {
    left: 35px;
}

.checkout-logo-right {
    right: 35px;
}

@media(max-width: 650px) {
    .checkout-corner-logo {
        width: 65px;
        top: 15px;
    }

    .checkout-logo-left {
        left: 15px;
    }

    .checkout-logo-right {
        right: 15px;
    }
}
</style>
</head>
<script src="js/nav.js"></script>
<body>
    <img src="images/logo.PNG" class="checkout-corner-logo checkout-logo-left" alt="Shift Happens">

<img src="images/logo.PNG" class="checkout-corner-logo checkout-logo-right" alt="Shift Happens">

    <main class="checkout-page">

        <h1 class="checkout-title">CHECKOUT</h1>

        <div class="checkout-box">

            <h2>Shipping Address</h2>

            <div class="address-grid">

                <input
                    id="shipping-name"
                    class="full-width"
                    type="text"
                    placeholder="Full Name"
                >

                <input
                    id="shipping-street"
                    class="full-width"
                    type="text"
                    placeholder="Street Address"
                >

                <input
                    id="shipping-street2"
                    class="full-width"
                    type="text"
                    placeholder="Apartment / Unit (optional)"
                >

                <input
                    id="shipping-city"
                    type="text"
                    placeholder="City"
                >

                <input
                    id="shipping-state"
                    type="text"
                    placeholder="State"
                    maxlength="2"
                >

                <input
                    id="shipping-zip"
                    type="text"
                    placeholder="ZIP Code"
                >

            </div>

            <button id="calculate-shipping" type="button">
                Calculate Shipping
            </button>

            <div id="shipping-rates"></div>

            <button id="continue-payment" type="button">
                Continue to Payment
            </button>

            <p class="checkout-note">
                Shipping rates will be calculated using live carrier rates.
            </p>

        </div>

    </main>

    <script src="js/checkout.js"></script>

</body>

</html>
