<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Shift Happens Motors</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .checkout-page {
            width: 90%;
            max-width: 900px;
            margin: 60px auto;
        }

        .checkout-title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 35px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .checkout-box h2 {
            margin-top: 0;
        }

        .address-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .address-grid input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        #calculate-shipping {
            margin-top: 18px;
            padding: 13px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #shipping-rates {
            margin-top: 25px;
        }

        #continue-payment {
            display: none;
            margin-top: 25px;
            padding: 14px 22px;
            font-size: 17px;
            cursor: pointer;
        }

        .checkout-note {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        @media(max-width: 650px) {
            .address-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <main class="checkout-page">

        <h1 class="checkout-title">CHECKOUT</h1>

        <div class="checkout-box">

            <h2>Shipping Address</h2>

            <div class="address-grid">

                <input
                    id="shipping-name"
                    class="full-width"
                    type="text"
                    placeholder="Full Name"
                >

                <input
                    id="shipping-street"
                    class="full-width"
                    type="text"
                    placeholder="Street Address"
                >

                <input
                    id="shipping-street2"
                    class="full-width"
                    type="text"
                    placeholder="Apartment / Unit (optional)"
                >

                <input
                    id="shipping-city"
                    type="text"
                    placeholder="City"
                >

                <input
                    id="shipping-state"
                    type="text"
                    placeholder="State (GA)"
                    maxlength="2"
                >

                <input
                    id="shipping-zip"
                    type="text"
                    placeholder="ZIP Code"
                >

            </div>

            <button id="calculate-shipping" type="button">
                Calculate Shipping
            </button>

            <div id="shipping-rates"></div>

            <button id="continue-payment" type="button">
                Continue to Payment
            </button>

            <p class="checkout-note">
                Shipping rates will be calculated using live carrier rates.
            </p>

        </div>

    </main>

    <script src="js/checkout.js"></script>

</body>

</html>
